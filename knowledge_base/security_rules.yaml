rules:
  - name: "Password Policy"
    category: "security"
    severity: "HIGH"
    description: "Passwords must meet complexity requirements"
    pattern: "password.*=.*['\\\"](?=.{0,10}$)"
    recommendation: "Use strong passwords with at least 12 characters, mixed case, numbers, and symbols"

  - name: "SQL Injection Prevention"
    category: "security"
    severity: "CRITICAL"
    description: "Prevent SQL injection through parameterized queries"
    pattern: "(SELECT|INSERT|UPDATE|DELETE).*\\+.*\\w+"
    recommendation: "Use parameterized queries or ORM instead of string concatenation"

  - name: "Cryptography Best Practices"
    category: "security"
    severity: "HIGH"
    description: "Use strong cryptographic algorithms"
    pattern: "(DES|RC4|MD5|SHA1)\\s*\\("
    recommendation: "Use AES-256, SHA-256, or other modern algorithms"

  - name: "Input Validation"
    category: "security"
    severity: "MEDIUM"
    description: "Validate all user input"
    pattern: "(innerHTML|document\\.write|eval)\\s*\\("
    recommendation: "Sanitize and validate all user input before processing"

  - name: "File Permissions"
    category: "security"
    severity: "MEDIUM"
    description: "Restrict file permissions"
    pattern: "chmod.*777|chmod.*666"
    recommendation: "Use restrictive file permissions (e.g., 600, 644)"

  - name: "Secret Management"
    category: "security"
    severity: "CRITICAL"
    description: "Do not hardcode secrets"
    pattern: "(api[_-]?key|secret|password|token)\\s*=\\s*['\\\"][^'\\\"]+['\\\"]"
    recommendation: "Use environment variables or secret management services"

  - name: "Command Injection Prevention"
    category: "security"
    severity: "CRITICAL"
    description: "Prevent command injection"
    pattern: "subprocess\\.(call|run|Popen)\\([^)]*shell\\s*=\\s*True"
    recommendation: "Avoid shell=True and use proper argument lists"
