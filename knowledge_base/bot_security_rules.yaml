rules:
  - name: "Telegram Bot Token Leak"
    category: "bot_security"
    severity: "CRITICAL"
    description: "Telegram bot token exposed in source code or config"
    pattern: "\\b\\d{8,10}:[A-Za-z0-9_-]{35}\\b"
    recommendation: "Rotate token via @BotFather, use environment variables"

  - name: "Discord Bot Token Leak"
    category: "bot_security"
    severity: "CRITICAL"
    description: "Discord bot token exposed in source code"
    pattern: "\\b[A-Za-z0-9_-]{24}\\.[A-Za-z0-9_-]{6}\\.[A-Za-z0-9_-]{27}\\b"
    recommendation: "Regenerate in Discord Developer Portal, use env vars"

  - name: "Slack Token Leak"
    category: "bot_security"
    severity: "CRITICAL"
    description: "Slack bot/user token exposed"
    pattern: "\\bxox[baprs]-[A-Za-z0-9-]{10,}"
    recommendation: "Rotate in Slack admin, use env vars or vault"

  - name: "Webhook Without HTTPS"
    category: "bot_security"
    severity: "HIGH"
    description: "Webhook URL uses HTTP instead of HTTPS"
    pattern: "webhook_url\\s*[=:]\\s*['\"]?http://[^'\"]+['\"]?"
    recommendation: "Use HTTPS with valid TLS certificates for all webhooks"

  - name: "Webhook Without Secret Verification"
    category: "bot_security"
    severity: "HIGH"
    description: "Webhook handler does not verify secret token"
    pattern: "@(app|bot|router)\\.(post|route|webhook)"
    recommendation: "Verify X-Telegram-Bot-Api-Secret-Token header with hmac.compare_digest"

  - name: "Bot eval/exec Usage"
    category: "bot_security"
    severity: "CRITICAL"
    description: "Use of eval() or exec() in bot code — potential RCE"
    pattern: "\\b(eval|exec)\\s*\\("
    recommendation: "Never eval/exec untrusted data. Use parsers and whitelists."

  - name: "Bot Command Injection"
    category: "bot_security"
    severity: "CRITICAL"
    description: "Subprocess call with shell=True in bot code"
    pattern: "subprocess\\.\\w+\\([^)]*shell\\s*=\\s*True"
    recommendation: "Use argument lists instead of shell=True"

  - name: "Insecure File Download in Bot"
    category: "bot_security"
    severity: "HIGH"
    description: "File download without type/size validation"
    pattern: "(?:download|save|write).*file"
    recommendation: "Validate MIME type, size, scan for malware before saving"

  - name: "Bot Without Rate Limiting"
    category: "bot_security"
    severity: "MEDIUM"
    description: "Bot handlers without rate limiting middleware"
    pattern: "@(app|bot|router)\\.(message|command|callback_query)"
    recommendation: "Add rate limiting middleware to prevent flood/abuse"

  - name: "Secrets in Bot Logs"
    category: "bot_security"
    severity: "HIGH"
    description: "Potential secret leakage in logging statements"
    pattern: "(?:logger|log|print)\\s*\\([^)]*(?:token|password|secret|key)"
    recommendation: "Never log tokens, passwords, or secrets. Redact sensitive fields."

  - name: "Insecure Container — Root User"
    category: "bot_security"
    severity: "HIGH"
    description: "Container runs as root user"
    pattern: "(?!.*USER\\s+\\w+).*CMD"
    recommendation: "Add USER directive with non-root user in Containerfile"

  - name: "Insecure Deserialization in Bot"
    category: "bot_security"
    severity: "HIGH"
    description: "Unsafe pickle/yaml.load in bot code"
    pattern: "pickle\\.loads?\\(|yaml\\.load\\([^)]*\\)(?!.*Loader)"
    recommendation: "Use yaml.safe_load() and never unpickle untrusted data"
