# Docker compose configuration for SAFEX
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: safex-postgres
    environment:
      POSTGRES_DB: safex_db
      POSTGRES_USER: safex
      POSTGRES_PASSWORD: safex_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safex"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safex-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: safex-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - safex-network

  # SAFEX API Server
  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: safex-api
    environment:
      - DATABASE_URL=postgresql://safex:safex_password@postgres:5432/safex_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEBUG=False
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - safex-network

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: safex-celery-worker
    command: celery -A src.queue.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql://safex:safex_password@postgres:5432/safex_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_TASK_ALWAYS_EAGER=False
    environment:
      - DATABASE_URL=postgresql://safex:safex_password@postgres:5432/safex_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - safex-network

  # Celery Beat (Scheduled Tasks)
  celery_beat:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: safex-celery-beat
    command: celery -A src.queue.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://safex:safex_password@postgres:5432/safex_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis://6379/1
    environment:
      - DATABASE_URL=postgresql://safex:safex_password@postgres:5432/safex_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis://6379/1
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - safex-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: safex-nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - safex-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  safex-network:
    driver: bridge
