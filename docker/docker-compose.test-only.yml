# Docker Compose: Только тестовый сервер (для проверки)
version: '3.8'

services:
  test-server:
    image: nginx:alpine
    container_name: test-vulnerable-server
    ports:
      - "8081:80"
    volumes:
      - ./test-targets:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--tries=1", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
